apiVersion: v1
kind: Service
metadata:
  name: ai-analyst-service
  namespace: ai-analyst
  labels:
    app: ai-analyst
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  selector:
    app: ai-analyst
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyst-headless
  namespace: ai-analyst
  labels:
    app: ai-analyst
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: ai-analyst
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP

