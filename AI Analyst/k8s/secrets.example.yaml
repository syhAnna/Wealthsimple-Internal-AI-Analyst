apiVersion: v1
kind: Secret
metadata:
  name: ai-analyst-secrets
  namespace: ai-analyst
type: Opaque
stringData:
  # OpenAI
  OPENAI_API_KEY: "your-openai-api-key"
  
  # Anthropic
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  
  # Database
  POSTGRES_HOST: "postgres-service.database.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "analytics"
  POSTGRES_USER: "analyst"
  POSTGRES_PASSWORD: "your-postgres-password"
  
  # Redis
  REDIS_HOST: "redis-service.cache.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "your-redis-password"
  
  # Pinecone
  PINECONE_API_KEY: "your-pinecone-api-key"
  PINECONE_ENVIRONMENT: "us-east-1-aws"
  PINECONE_INDEX: "schema-embeddings"
  
  # Observability
  JAEGER_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:14268/api/traces"
  
  # Security
  JWT_SECRET: "your-jwt-secret-key"
  ENCRYPTION_KEY: "your-encryption-key"

# Made with Bob
