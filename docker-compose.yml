version: "3.9"

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://analyst:analyst@postgres:5432/analytics
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - FLAG_USE_PINECONE=${FLAG_USE_PINECONE:-false}
      - FLAG_ENABLE_COST_ESTIMATOR=${FLAG_ENABLE_COST_ESTIMATOR:-true}
      - FLAG_ENABLE_FEEDBACK_LOGGING=${FLAG_ENABLE_FEEDBACK_LOGGING:-true}
      - FLAG_ENABLE_RISK_SCORING=${FLAG_ENABLE_RISK_SCORING:-true}
      - FLAG_ENABLE_QUERY_CACHE=${FLAG_ENABLE_QUERY_CACHE:-true}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-analyst-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - ai-analyst-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=analyst
      - POSTGRES_PASSWORD=analyst
      - POSTGRES_DB=analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - ai-analyst-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ai-analyst-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

